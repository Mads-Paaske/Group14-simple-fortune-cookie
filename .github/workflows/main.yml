name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Lint backend
        working-directory: backend
        run: go vet ./...

      - name: Lint frontend
        working-directory: frontend
        run: go vet ./...

      - name: Build backend
        working-directory: backend
        run: go build 

      - name: Build frontend
        working-directory: frontend
        run: go build frontend

      - name: Test frontend
        working-directory: frontend
        run: go test -v ./...


  push-images:
    needs: build-and-test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/fortune-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/fortune-frontend:latest

  deploy:
    name: Deploy to Kubernetes (production)
    needs: test-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
 
      - name: Write kubeconfig to disk
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
 
      - name: Apply manifests
        run: kubectl --kubeconfig kubeconfig apply -f backend/k8s/redis.yaml -f backend/k8s/backend-configmap.yaml -f backend/k8s/backend-manifest -f frontend/k8s/frontend-configmap.yaml -f frontend/k8s/frontend-manifest 
      - name: Force fresh pods
        run: |
          kubectl --kubeconfig kubeconfig delete pods -l app=backend,version=v1
          kubectl --kubeconfig kubeconfig delete pods -l app=frontend,version=v1

  test-deploy:
    name: Deploy and Test (isolated test version)
    needs: push-images
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set lowercase repository owner
        id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Write kubeconfig to disk
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy and test temporary version
        run: |
          set -eu
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test_backend="backend-test-${suffix}"
          test_frontend="frontend-test-${suffix}"
          test_backend_config="backend-config-test-${suffix}"
          test_frontend_config="frontend-config-test-${suffix}"

          manifests=$(mktemp -d)
          cp backend/k8s/backend-configmap.yaml "$manifests"/backend-configmap.yaml
          cp frontend/k8s/frontend-configmap.yaml "$manifests"/frontend-configmap.yaml
          cp backend/k8s/backend-manifest "$manifests"/backend-manifest.yaml
          cp frontend/k8s/frontend-manifest "$manifests"/frontend-manifest.yaml

          sed -i \
            -e "s|backend-config|${test_backend_config}|g" \
            -e "s|backend-v1|${test_backend}|g" \
            -e "s|version: v1|version: test|g" \
            -e "s|replicas: 2|replicas: 1|g" \
            "$manifests"/backend-configmap.yaml "$manifests"/backend-manifest.yaml

          sed -i \
            -e "s|frontend-config|${test_frontend_config}|g" \
            -e "s|frontend-v1|${test_frontend}|g" \
            -e "s|version: v1|version: test|g" \
            -e "s|replicas: 2|replicas: 1|g" \
            -e "s|BACKEND_DNS.*|BACKEND_DNS: \"${test_backend}\"|g" \
            "$manifests"/frontend-configmap.yaml "$manifests"/frontend-manifest.yaml

          frontend_pid=
          backend_pid=
          trap 'kill "$frontend_pid" "$backend_pid" 2>/dev/null || true; kubectl --kubeconfig kubeconfig delete -f "$manifests" --ignore-not-found --wait=false || true' EXIT

          kubectl --kubeconfig kubeconfig apply -f "$manifests"
          kubectl --kubeconfig kubeconfig rollout status "deployment/${test_frontend}" --timeout=180s
          kubectl --kubeconfig kubeconfig rollout status "deployment/${test_backend}" --timeout=180s

          kubectl --kubeconfig kubeconfig port-forward "service/${test_frontend}" 8080:80 >/dev/null 2>&1 &
          frontend_pid=$!

          kubectl --kubeconfig kubeconfig port-forward "service/${test_backend}" 9000:9000 >/dev/null 2>&1 &
          backend_pid=$!

          chmod +x scripts/smoketest.sh
          ./scripts/smoketest.sh http://localhost:8080
          ./scripts/smoketest.sh http://localhost:9000