name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build backend
        working-directory: backend
        run: go build 

      - name: Build frontend
        working-directory: frontend
        run: go build frontend

      - name: Test frontend
        working-directory: frontend
        run: go test -v ./...


  push-images:
    needs: build-and-test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/fortune-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/fortune-frontend:latest

  deploy:
    name: Deploy to Kubernetes
    needs: push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
 
      - name: Write kubeconfig to disk
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
 
      - name: Apply manifests
        run: kubectl --kubeconfig kubeconfig apply -f backend/k8s/redis.yaml -f backend/k8s/backend-configmap.yaml -f backend/k8s/backend-manifest -f frontend/k8s/frontend-configmap.yaml -f frontend/k8s/frontend-manifest 
      - name: Force fresh pods
        run: |
          kubectl --kubeconfig kubeconfig delete pods -l app=backend,version=v1
          kubectl --kubeconfig kubeconfig delete pods -l app=frontend,version=v1

  test-deploy:
    name: Deploy and Test (isolated test version)
    needs: push-images
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig to disk
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy test version
        run: |
          kubectl --kubeconfig kubeconfig apply -f backend/k8s/backend-test-manifest
          kubectl --kubeconfig kubeconfig apply -f frontend/k8s/frontend-test-manifest
          kubectl --kubeconfig kubeconfig rollout status deployment/backend-test
          kubectl --kubeconfig kubeconfig rollout status deployment/frontend-test

      - name: Test the test version
        run: |
          kubectl --kubeconfig kubeconfig port-forward service/frontend-test 8080:80 &
          sleep 10
          chmod +x scripts/smoketest.sh
          ./scripts/smoketest.sh http://localhost:8080/healthz

      - name: Tear down test version
        if: always()
        run: |
          kubectl --kubeconfig kubeconfig delete -f backend/k8s/backend-test-manifest --ignore-not-found
          kubectl --kubeconfig kubeconfig delete -f frontend/k8s/frontend-test-manifest --ignore-not-found