name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build backend
        working-directory: backend
        run: go build 

      - name: Build frontend
        working-directory: frontend
        run: go build frontend

      - name: Test frontend
        working-directory: frontend
        run: go test -v ./...
